<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class = "container-wrapper">
            <div class="container">
                <div class = "home">
                    <h3 id = "home-header">HOME</h3>
                    <div class = "num" id = "home-num">0</div>
                    <div class = "btn-wrapper">
                        <button class = "increment-btn" onclick = "add1home()"> +1 </button>
                        <button class = "increment-btn" onclick = "add2home()"> +2 </button>
                        <button class = "increment-btn" onclick = "add3home()"> +3 </button>
                    </div>
                </div>
                <div class = "guest">
                    <h3 id = "guest-header">GUEST</h3>
                    <div class = "num" id = "guest-num">0</div>
                    <div class = "btn-wrapper">
                        <button class = "increment-btn" onclick = "add1guest()"> +1 </button>
                        <button class = "increment-btn" onclick = "add2guest()"> +2 </button>
                        <button class = "increment-btn" onclick = "add3guest()"> +3 </button>
                    </div>
                </div> 
            </div>
            <button class = "ng-btn" onclick = "ng()"> new game</button>
            <script src="index.js"></script>
        </div>
    </body>
</html>
